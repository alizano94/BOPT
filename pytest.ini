[pytest]
# Flat layout with no `pip install -e .` means pytest would otherwise prepend
# `tests/` to sys.path rather than the repo root, and `import bopt` would fail.
# This is the one line of friction that a src/ layout would have removed.
pythonpath = .

testpaths = tests
addopts = -ra --strict-markers

# `--strict-markers` means every marker must be declared here or collection fails.
# Run the fast suite with:  pytest -m "not slow"
markers =
    slow: exercises GP fitting and acquisition optimization; seconds per proposal
